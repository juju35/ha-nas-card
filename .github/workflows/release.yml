name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build with the tag version
        run: |
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm run build

      - name: Create release with ugreen-nas-card.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/ugreen-nas-card.js --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/ugreen-nas-card.js --title "$GITHUB_REF_NAME" --generate-notes
          fi
